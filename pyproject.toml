[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truemoney-voucher"
version = "1.1.0"
description = "Zero-dependency client for the Truemoney-Voucher REST APIs (Go / NestJS / FastAPI ports) — auto-selects the fastest healthy backend and redeems TrueMoney gift vouchers with pip, uv, poetry or any Python runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ByteInDev" }]
keywords = ["truemoney", "voucher", "gift", "redeem", "thailand", "api-client", "vercel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/ByteInDev/Truemoney-Voucher-Package-pip"
"TrueMoney status reference" = "https://gift.truemoney.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truemoney_voucher = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Test fixtures keep long exact-URL mapping lines — wrapping them would
# obscure the very payloads the tests assert on.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
